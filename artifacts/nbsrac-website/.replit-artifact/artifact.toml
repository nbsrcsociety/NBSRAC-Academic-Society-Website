kind = "web"
previewPath = "/"
title = "NBSRAC Academic Society Website"
description = "A responsive public website for the North Bengal Society for Research and Academic Collaboration, presenting its mission, objectives, committee, activities, publications, membership, partners, and contact information."
version = "1.0.0"
id = "artifacts/nbsrac-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19477

[services.development]
run = "pnpm --filter @workspace/nbsrac-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nbsrac-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/nbsrac-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19477"
BASE_PATH = "/"
